<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - Modern To-Do & Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar and subtle transitions */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
    .task-item {
      transition: all 0.2s ease-in-out;
    }
    .task-item:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">

<div class="max-w-3xl mx-auto px-4 py-8 sm:py-12">
  <!-- Top App Bar -->
  <header class="flex items-center justify-between mb-8 pb-4 border-b border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">
          TaskFlow
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Keep things organized, one step at a time</p>
      </div>
    </div>
    
    <!-- Controls: Theme toggle & quick clear -->
    <div class="flex items-center gap-2">
      <button id="themeToggleBtn" aria-label="Toggle Dark Mode" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
        <svg id="themeIconSun" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg id="themeIconMoon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </div>
  </header>

  <section class="bg-white dark:bg-slate-800/80 rounded-2xl p-5 mb-6 border border-slate-200 dark:border-slate-700/60 shadow-sm backdrop-blur-sm">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Overall Progress</span>
      <span id="progressPercent" class="text-sm font-bold text-indigo-600 dark:text-indigo-400">0%</span>
    </div>
    <div class="w-full bg-slate-100 dark:bg-slate-700/50 rounded-full h-2.5 overflow-hidden">
      <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-violet-500 h-2.5 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
    </div>
    <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 mt-2.5">
      <span id="activeCount">0 active tasks</span>
      <span id="completedCount">0 completed</span>
    </div>
  </section>

  <section class="bg-white dark:bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-200 dark:border-slate-700/60 shadow-sm">
    <form id="taskForm" class="space-y-4">
      <div>
        <label for="taskTitle" class="sr-only">Task Title</label>
        <input 
          type="text" 
          id="taskTitle" 
          required 
          placeholder="What needs to be done?" 
          class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-sm font-medium transition"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <!-- Priority -->
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Priority</label>
          <select id="taskPriority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
            <option value="medium">Medium Priority</option>
            <option value="high">High Priority</option>
            <option value="low">Low Priority</option>
          </select>
        </div>

        <!-- Category -->
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Category</label>
          <select id="taskCategory" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <!-- Due Date -->
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Due Date</label>
          <input 
            type="date" 
            id="taskDueDate" 
            class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
          />
        </div>
      </div>

      <div class="flex justify-end pt-1">
        <button 
          type="submit" 
          class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm transition-colors shadow-sm shadow-indigo-600/20 active:scale-95 duration-150"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
          </svg>
          Add Task
        </button>
      </div>
    </form>
  </section>

  <section class="space-y-3 mb-6">
    <div class="flex flex-col sm:flex-row gap-3">
      <!-- Search Input -->
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </span>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search your tasks..." 
          class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
        />
      </div>

      <!-- Sorting Select -->
      <div class="w-full sm:w-48">
        <select id="sortBy" class="w-full py-2.5 px-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
          <option value="createdAt_desc">Newest First</option>
          <option value="createdAt_asc">Oldest First</option>
          <option value="dueDate_asc">Due Date (Earliest)</option>
          <option value="priority_desc">Priority (High to Low)</option>
        </select>
      </div>
    </div>

    <!-- Status Tabs -->
    <div class="flex items-center justify-between flex-wrap gap-2 pt-1">
      <div class="flex p-1 bg-slate-200/70 dark:bg-slate-800 rounded-xl text-xs font-medium">
        <button data-filter="all" class="filter-btn active px-3.5 py-1.5 rounded-lg transition-all text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-700 shadow-sm font-semibold">
          All
        </button>
        <button data-filter="active" class="filter-btn px-3.5 py-1.5 rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          Active
        </button>
        <button data-filter="completed" class="filter-btn px-3.5 py-1.5 rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          Completed
        </button>
      </div>

      <!-- Batch Actions -->
      <button 
        id="clearCompletedBtn" 
        class="text-xs text-rose-500 hover:text-rose-600 dark:hover:text-rose-400 font-medium px-2 py-1 transition"
      >
        Clear Completed
      </button>
    </div>
  </section>

  <main>
    <ul id="taskList" class="space-y-3" role="list">
      <!-- Populated dynamically via JS -->
    </ul>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12 px-4 bg-white/50 dark:bg-slate-800/40 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">
      <div class="mx-auto w-12 h-12 mb-3 text-slate-400 dark:text-slate-600">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
      </div>
      <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">No tasks found</p>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Get started by creating a new task above!</p>
    </div>
  </main>
</div>

<div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-md shadow-xl border border-slate-200 dark:border-slate-700">
    <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Edit Task</h2>
    <form id="editForm" class="space-y-4">
      <input type="hidden" id="editTaskId" />
      <div>
        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Title</label>
        <input 
          type="text" 
          id="editTitle" 
          required 
          class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
        />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Priority</label>
          <select id="editPriority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-700 dark:text-slate-200">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Category</label>
          <select id="editCategory" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-700 dark:text-slate-200">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Study">Study</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Due Date</label>
        <input 
          type="date" 
          id="editDueDate" 
          class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-700 dark:text-slate-200"
        />
      </div>

      <div class="flex justify-end gap-2 pt-3">
        <button 
          type="button" 
          id="cancelEditBtn" 
          class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
        >
          Cancel
        </button>
        <button 
          type="submit" 
          class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium transition"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // App state
  const STORAGE_KEY = 'taskflow_tasks_v1';
  const THEME_KEY = 'taskflow_theme';

  let tasks = [];
  let currentFilter = 'all';
  let searchQuery = '';
  let currentSort = 'createdAt_desc';

  // DOM Elements
  const taskList = document.getElementById('taskList');
  const emptyState = document.getElementById('emptyState');
  const taskForm = document.getElementById('taskForm');
  const taskTitle = document.getElementById('taskTitle');
  const taskPriority = document.getElementById('taskPriority');
  const taskCategory = document.getElementById('taskCategory');
  const taskDueDate = document.getElementById('taskDueDate');

  const progressPercent = document.getElementById('progressPercent');
  const progressBar = document.getElementById('progressBar');
  const activeCount = document.getElementById('activeCount');
  const completedCount = document.getElementById('completedCount');

  const searchInput = document.getElementById('searchInput');
  const sortBySelect = document.getElementById('sortBy');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const clearCompletedBtn = document.getElementById('clearCompletedBtn');

  // Edit Modal Elements
  const editModal = document.getElementById('editModal');
  const editForm = document.getElementById('editForm');
  const editTaskId = document.getElementById('editTaskId');
  const editTitle = document.getElementById('editTitle');
  const editPriority = document.getElementById('editPriority');
  const editCategory = document.getElementById('editCategory');
  const editDueDate = document.getElementById('editDueDate');
  const cancelEditBtn = document.getElementById('cancelEditBtn');

  // Dark mode elements
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  const themeIconSun = document.getElementById('themeIconSun');
  const themeIconMoon = document.getElementById('themeIconMoon');

  function initTheme() {
    const savedTheme = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add('dark');
      themeIconSun.classList.remove('hidden');
      themeIconMoon.classList.add('hidden');
    } else {
      document.documentElement.classList.remove('dark');
      themeIconSun.classList.add('hidden');
      themeIconMoon.classList.remove('hidden');
    }
  }

  themeToggleBtn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    themeIconSun.classList.toggle('hidden', !isDark);
    themeIconMoon.classList.toggle('hidden', isDark);
  });

  function loadTasks() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      try {
        tasks = JSON.parse(data);
      } catch (e) {
        tasks = [];
      }
    } else {
      // Seed default helpful tasks for first-time visitors
      tasks = [
        {
          id: '1',
          title: 'Review weekly goals',
          priority: 'high',
          category: 'Work',
          dueDate: new Date(Date.now() + 86400000).toISOString().split('T')[0],
          completed: false,
          createdAt: Date.now() - 20000
        },
        {
          id: '2',
          title: 'Pick up groceries',
          priority: 'medium',
          category: 'Shopping',
          dueDate: '',
          completed: true,
          createdAt: Date.now() - 40000
        }
      ];
      saveTasks();
    }
  }

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    updateStats();
    renderTasks();
  }

  function updateStats() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const active = total - completed;
    const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

    progressBar.style.width = `${percent}%`;
    progressPercent.textContent = `${percent}%`;
    activeCount.textContent = `${active} active task${active === 1 ? '' : 's'}`;
    completedCount.textContent = `${completed} completed`;
  }

  function getPriorityBadge(priority) {
    switch (priority) {
      case 'high':
        return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300">High</span>';
      case 'medium':
        return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300">Med</span>';
      default:
        return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300">Low</span>';
    }
  }

  function getCategoryBadge(category) {
    return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-600 dark:bg-indigo-950/60 dark:text-indigo-300">${category}</span>`;
  }

  function formatDueDate(dateStr) {
    if (!dateStr) return '';
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const [year, month, day] = dateStr.split('-');
    const due = new Date(year, month - 1, day);

    const diffDays = Math.round((due - today) / (1000 * 60 * 60 * 24));

    if (diffDays < 0) {
      return `<span class="text-rose-600 dark:text-rose-400 font-semibold text-xs flex items-center gap-1">Overdue (${dateStr})</span>`;
    } else if (diffDays === 0) {
      return `<span class="text-amber-600 dark:text-amber-400 font-semibold text-xs flex items-center gap-1">Due Today</span>`;
    } else if (diffDays === 1) {
      return `<span class="text-indigo-600 dark:text-indigo-400 text-xs">Tomorrow</span>`;
    }
    return `<span class="text-slate-500 dark:text-slate-400 text-xs">${dateStr}</span>`;
  }

  function renderTasks() {
    let filtered = tasks.filter(task => {
      if (currentFilter === 'active') return !task.completed;
      if (currentFilter === 'completed') return task.completed;
      return true;
    });

    if (searchQuery.trim() !== '') {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(task =>
        task.title.toLowerCase().includes(q) ||
        task.category.toLowerCase().includes(q)
      );
    }

    filtered.sort((a, b) => {
      if (currentSort === 'createdAt_desc') return b.createdAt - a.createdAt;
      if (currentSort === 'createdAt_asc') return a.createdAt - b.createdAt;
      if (currentSort === 'dueDate_asc') {
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;
        return a.dueDate.localeCompare(b.dueDate);
      }
      if (currentSort === 'priority_desc') {
        const weights = { high: 3, medium: 2, low: 1 };
        return weights[b.priority] - weights[a.priority];
      }
      return 0;
    });

    taskList.innerHTML = '';

    if (filtered.length === 0) {
      emptyState.classList.remove('hidden');
    } else {
      emptyState.classList.add('hidden');
      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700/60 shadow-sm flex items-center justify-between gap-3 ${
          task.completed ? 'opacity-70' : ''
        }`;

        li.innerHTML = `
          <div class="flex items-center gap-3.5 flex-1 min-w-0">
            <button 
              onclick="toggleTaskStatus('${task.id}')"
              class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${
                task.completed 
                  ? 'bg-indigo-600 border-indigo-600 text-white' 
                  : 'border-slate-300 dark:border-slate-600 hover:border-indigo-500'
              }"
              aria-label="Toggle completed"
            >
              ${task.completed ? `
                <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                </svg>
              ` : ''}
            </button>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}">
                ${escapeHtml(task.title)}
              </p>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                ${getPriorityBadge(task.priority)}
                ${getCategoryBadge(task.category)}
                ${task.dueDate ? formatDueDate(task.dueDate) : ''}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button 
              onclick="openEditModal('${task.id}')" 
              class="p-2 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
              title="Edit Task"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
            </button>
            <button 
              onclick="deleteTask('${task.id}')" 
              class="p-2 rounded-lg text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
              title="Delete Task"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        `;
        taskList.appendChild(li);
      });
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }

  taskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = taskTitle.value.trim();
    if (!title) return;

    const newTask = {
      id: Date.now().toString(),
      title,
      priority: taskPriority.value,
      category: taskCategory.value,
      dueDate: taskDueDate.value,
      completed: false,
      createdAt: Date.now()
    };

    tasks.unshift(newTask);
    saveTasks();
    taskForm.reset();
  });

  window.toggleTaskStatus = function(id) {
    tasks = tasks.map(task => 
      task.id === id ? { ...task, completed: !task.completed } : task
    );
    saveTasks();
  };

  window.deleteTask = function(id) {
    tasks = tasks.filter(task => task.id !== id);
    saveTasks();
  };

  clearCompletedBtn.addEventListener('click', () => {
    tasks = tasks.filter(task => !task.completed);
    saveTasks();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => {
        b.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'font-semibold');
        b.classList.add('text-slate-600', 'dark:text-slate-400');
      });
      btn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'font-semibold');
      btn.classList.remove('text-slate-600', 'dark:text-slate-400');
      currentFilter = btn.dataset.filter;
      renderTasks();
    });
  });

  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderTasks();
  });

  sortBySelect.addEventListener('change', (e) => {
    currentSort = e.target.value;
    renderTasks();
  });

  window.openEditModal = function(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    editTaskId.value = task.id;
    editTitle.value = task.title;
    editPriority.value = task.priority;
    editCategory.value = task.category;
    editDueDate.value = task.dueDate || '';

    editModal.classList.remove('hidden');
  };

  function closeEditModal() {
    editModal.classList.add('hidden');
  }

  cancelEditBtn.addEventListener('click', closeEditModal);
  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) closeEditModal();
  });

  editForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = editTaskId.value;
    const title = editTitle.value.trim();
    if (!title) return;

    tasks = tasks.map(t => {
      if (t.id === id) {
        return {
          ...t,
          title,
          priority: editPriority.value,
          category: editCategory.value,
          dueDate: editDueDate.value
        };
      }
      return t;
    });

    saveTasks();
    closeEditModal();
  });

  // Initialization
  initTheme();
  loadTasks();
  updateStats();
  renderTasks();
</script>
</body>
</html>
